name: orbit

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine.py', 'delivery.py', 'poll_notify.py', 'cloud.py', '.github/workflows/poll-notify.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: orbit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      STATE_ENCRYPTED: '1'
      STATE_PATH: '.local/state.enc'
      STATE_KEY: ${{ secrets.STATE_KEY }}
      CLOUD_CHECKPOINT: '1'
      GITHUB_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Prepare
        run: pip install -r requirements-worker.txt
      - name: Configure
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          test -n "$ENV_FILE" || { echo 'Missing ENV_FILE'; exit 1; }
          umask 077
          printf '%s\n' "$ENV_FILE" > .env
      - name: Restore
        id: restore
        run: python cloud.py pull
      - name: Gate
        id: gate
        run: python scripts/gate.py
      - name: Check
        id: observe
        if: steps.gate.outputs.proceed == 'true'
        run: python poll_notify.py
      - name: Persist
        if: always() && steps.restore.outcome == 'success' && steps.gate.outputs.proceed == 'true'
        run: python cloud.py push
      - name: Recovery
        if: always() && steps.restore.outcome == 'success' && hashFiles('.local/state.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: state-v2
          path: .local/state.enc
          include-hidden-files: true
          retention-days: 7
      - name: Clean
        if: always()
        run: rm -f .env

  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: check
    if: always() && !cancelled() && (needs.check.outputs.proceed == 'true' || needs.check.result == 'failure')
    steps:
      - name: Continue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          for attempt in 1 2 3; do
            if gh workflow run poll-notify.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo 'Continuation queued'
              exit 0
            fi
            sleep 10
          done
          echo 'Continuation unavailable; schedule remains enabled'
          exit 1
