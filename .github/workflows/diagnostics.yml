name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONUNBUFFERED: '1'
      STATE_ENCRYPTED: '1'
      STATE_PATH: '.local/state.enc'
      STATE_KEY: ${{ secrets.STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-worker.txt
      - name: Configure
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env
      - run: python -m unittest discover -s tests -v
      - run: python cloud.py pull
      - name: Observe without sending or changing durable state
        run: python poll_notify.py --dry-run
      - name: Authenticate without sending
        run: python -c "from engine import load_env; load_env('.env'); import delivery; print('SMTP available:', delivery.probe())"
      - if: always()
        run: rm -f .env
